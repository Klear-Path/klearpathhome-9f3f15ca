[pytest]
# Run from the repository root:
#   python -m pytest pilot/adapters/windows/tests
#
# The unit suite is platform-independent. The integration suite is skipped
# unless the host is Windows AND KLEARFLOW_PILOT_WINDOWS_INTEGRATION=1.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: drives a real Windows desktop; needs an interactive session
